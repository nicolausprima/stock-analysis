# Ruff baseline — stock-analysis (branch developments)
# Dibuat saat pembersihan S-2 P0: 461 -> 180 errors setelah auto-fix aman.
# Prinsip: auto-fix aman diterapkan langsung; sisa di bawah ini BUTUH review
# manual per-call-site (BLE001/S110/S112/LOG015/DTZ) dan TIDAK di-silent global.
# Setiap ignore di bawah terarah per-file dengan alasan terdokumentasi.
# Target: CI hijau tanpa ubah logika; penghapusan ignore = perbaiki call-site dulu.

exclude = [
    "_retrain_tmp.py", # file kerja sementara, untracked, bukan bagian pipeline
    "notebooks/*.ipynb", # notebook eksplorasi; FURB177 di cell bukan kode produksi
    "data/", # artefak data (db/cache), bukan source
    ".venv/",
]

[lint]
# E722 sudah 0 (diperbaiki manual -> except Exception). Jangan buka lagi.
# select disengaja MINIMAL: set default ruff (E4,E7,E9,F) + aturan yang sudah
# dibersihkan via auto-fix (I,UP) + sisa baseline terarah (S,BLE,LOG,RUF,SIM,PLR,DTZ,FURB).
# TIDAK pakai select=["E",...] penuh (aktifkan ratusan aturan baru: E501,S101,PLR2004...).

[lint.per-file-ignores]
# Batch collector / scheduler / pipeline: broad-except = best-effort per-ticker.
# Satu ticker gagal (network yfinance, parsing) TIDAK boleh matikan batch 50 saham.
# S110/S112 (pass/continue tanpa log) disengaja: loop hot-path, logging per-item = spam.
"src/collector/*.py" = ["BLE001", "S110", "S112", "DTZ011"]
"src/scheduler/*.py" = ["BLE001", "S110", "S112"]
"src/sentiment/*.py" = ["BLE001", "S110", "S112"]
"src/database/*.py" = ["BLE001", "S110", "S112"]
"src/agents/*.py" = ["BLE001", "S110", "S112", "DTZ011"]
"src/explainability/*.py" = ["BLE001", "S110", "S112"]
"scripts/*.py" = ["BLE001", "S110", "S112"]
"src/features/*.py" = ["BLE001", "S110", "S112", "DTZ011", "LOG015"]
"src/notifications/*.py" = ["BLE001", "S110", "S112"]
"src/screener.py" = ["BLE001", "S110", "S112", "LOG015"]
"src/backtest/*.py" = ["BLE001", "S110", "S112"]
"main_cli.py" = ["BLE001", "S110", "S112"]

# Dashboard backend: route handler FastAPI. Broad-except = graceful fallback
# (fallback-quantitative / cache-miss) agar satu provider down tidak 500-kan API.
# audit.py: format "%Y-%m-%d %H:%M:%S" WIB dari sqlite lokal (created_at string),
# bukan wall-clock ambigu — penambahan tzinfo ubah semantik perbandingan string.
# Review manual per-endpoint tetap dianjurkan sebelum hapus ignore ini.
"dashboard/backend/**/*.py" = ["BLE001", "S110", "S112", "DTZ005", "DTZ007"]

# Test: fixture/conftest sengaja toleran (skip jika resource eksternal absen).
"tests/*.py" = ["BLE001", "S110", "S112"]
